<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Green rounded square background -->
  <rect width="512" height="512" rx="108" fill="#0d9668"/>
  
  <!-- Dumbbell rotated -45 degrees, centered -->
  <g transform="translate(256,256) rotate(-45)" fill="none" stroke="#ffffff" stroke-width="36" stroke-linecap="round" stroke-linejoin="round">
    <!-- Central bar -->
    <line x1="-120" y1="0" x2="120" y2="0"/>
    
    <!-- Left weight plates (two parallel bars) -->
    <line x1="-100" y1="-52" x2="-100" y2="52"/>
    <line x1="-135" y1="-40" x2="-135" y2="40"/>
    
    <!-- Right weight plates (two parallel bars) -->
    <line x1="100" y1="-52" x2="100" y2="52"/>
    <line x1="135" y1="-40" x2="135" y2="40"/>
  </g>
</svg>
