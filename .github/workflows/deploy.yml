name: Deploy Frontend to Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. Dependências
      - name: Install dependencies
        run: |
          rm -f package-lock.json
          npm install

      # 4. Build
      - name: Build Web Frontend
        run: npm run build --workspace web
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}

      # 5. Deploy via lftp (suporta FTP, FTPS e SFTP com retry automático)
      - name: Deploy to Hostinger
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp sshpass
          
          echo "=== Tentando SFTP (porta 65002) ==="
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" \
            -e "set sftp:auto-confirm yes; set net:timeout 30; set net:max-retries 3; set net:reconnect-interval-base 5; mirror -R --verbose web/dist/ ./; quit" \
            sftp://"$FTP_SERVER":65002 && echo "SFTP OK" && exit 0 || true

          echo "=== SFTP falhou, tentando FTPS (porta 21) ==="
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" \
            -e "set ftp:ssl-force true; set ssl:verify-certificate no; set net:timeout 30; set net:max-retries 3; set net:reconnect-interval-base 5; mirror -R --verbose web/dist/ ./; quit" \
            ftp://"$FTP_SERVER":21 && echo "FTPS OK" && exit 0 || true

          echo "=== FTPS falhou, tentando FTP simples (porta 21) ==="
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" \
            -e "set ftp:ssl-allow no; set net:timeout 30; set net:max-retries 3; set net:reconnect-interval-base 5; mirror -R --verbose web/dist/ ./; quit" \
            ftp://"$FTP_SERVER":21

        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
